components:
  schemas:
    TipoContrato:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        duracion_dias:
          type: integer
      required:
        - nombre

    TipoContratoUpdate:
      type: object
      properties:
        nombre:
          type: string
        duracion_dias:
          type: integer

    Sector:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
      required:
        - nombre

    SectorUpdate:
      type: object
      properties:
        nombre:
          type: string

    Cargo:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        salario_base:
          type: number
          format: float
        sector_id:
          type: integer
      required:
        - nombre
        - salario_base

    CargoUpdate:
      type: object
      properties:
        nombre:
          type: string
        salario_base:
          type: number
          format: float
        sector_id:
          type: integer

    Pais:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
      required:
        - nombre
    
    PaisUpdate:
      type: object
      properties:
        nombre:
          type: string

    Departamento:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        pais_id:
          type: integer
      required:
        - nombre
        - pais_id

    DepartamentoUpdate:
      type: object
      properties:
        nombre:
          type: string
        pais_id:
          type: integer

    Ciudad:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        departamento_id:
          type: integer
      required:
        - nombre
        - departamento_id

    CiudadUpdate:
      type: object
      properties:
        nombre:
          type: string
        departamento_id:
          type: integer

    Barrio:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        ciudad_id:
          type: integer
      required:
        - nombre
        - ciudad_id

    BarrioUpdate:
      type: object
      properties:
        nombre:
          type: string
        ciudad_id:
          type: integer