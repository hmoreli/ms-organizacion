            type: integer
      responses:
        '204':
          description: Departamento eliminado exitosamente.
        '404':
          description: Departamento no encontrado.

  /ciudades:
    get:
      tags:
        - Ciudades
      summary: Obtener la lista de ciudades
      responses:
        '200':
          description: Lista de ciudades obtenida.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ciudad'
    post:
      tags:
        - Ciudades
      summary: Crear una nueva ciudad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ciudad'
      responses:
        '201':
          description: Ciudad creada.

  /departamentos/{departamento_id}/ciudades:
    get:
      tags:
        - Departamentos
      summary: Obtener ciudades por ID de departamento
      parameters:
        - name: departamento_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de ciudades por departamento.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ciudad'
        '404':
          description: No se encontraron ciudades para el departamento proporcionado.
  
  /ciudades/{id}:
    get:
      tags:
        - Ciudades
      summary: Obtener una ciudad por ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
